  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - _pages/blog.md
  - _pages/books.md
  - _pages/cv.md
  - _pages/dropdown.md
  - _pages/news.md
  - _pages/profiles.md
  - _pages/projects.md
  - _pages/publications.md
  - _pages/repositories.md
  - _pages/teaching.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor
  - _posts
  - _news
  - _projects
  - _books
  - _teachings
  - _sass
  - _scripts
  - _bibliography
  - _data
  - AGENTS.md
  - ANALYTICS.md
  - CUSTOMIZE.md
  - FAQ.md
  - INSTALL.md
  - QUICKSTART.md
  - SEO.md
  - TROUBLESHOOTING.md

keep_files:
